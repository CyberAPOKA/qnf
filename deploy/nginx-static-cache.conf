# Cache de imagens estáticas (incluir no server {} do nginx).
# Fotos de jogadores/perfil usam nome hash no upload → cache longo + immutable.
# Demais arquivos em /storage podem ser regenerados no mesmo path → TTL menor.

location ^~ /storage/players/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ^~ /storage/profile-photos/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ^~ /storage/ {
    access_log off;
    expires 1d;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
}

location ^~ /assets/ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
    try_files $uri =404;
}
